name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate release tag
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
      - run: npm run verify
      - name: Create checksum
        shell: bash
        run: |
          cd dist
          sha256sum "zotero-focus-columns-${VERSION}.xpi" > SHA256SUMS
      - name: Create private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/zotero-focus-columns-${VERSION}.xpi" \
            "dist/SHA256SUMS" \
            --draft \
            --generate-notes \
            --title "Focus Columns ${VERSION}" \
            --verify-tag
